 g={name,style,stage:0,round:0,stats:{trust:25,pop:25,lead:25,policy:20,speech:25,network:20},cash:12,won:0,log:[],news:[],party:null,partyFounded:false,partySupport:0,termsServed:0,opponent:rivals[Math.floor(Math.random()*rivals.length)],approval:50,impeach:0,term:0,presTerm:0,age:8,phase:"career",done:false,electionCount:0};
 if(style==="balanced"){g.stats.trust+=6;g.stats.network+=5}
 if(style==="speech"){g.stats.pop+=8;g.stats.speech+=6}
 if(style==="policy"){g.stats.policy+=9;g.stats.lead+=3}
 if(style==="reform"){g.stats.lead+=8;g.stats.pop+=4;g.stats.trust-=2}
 document.getElementById("setup").hidden=true;document.getElementById("game").hidden=false;
 news("새로운 정치인이 등장했습니다. 지역 사회의 관심이 모이고 있습니다.");
 render();
}
function render(){
 if(!g||g.done)return;
 let stage=stages[g.stage];let presidential=g.phase==="president";
 document.getElementById("stageTag").textContent=presidential?"대통령 임기":stage.name;
 document.getElementById("stageTitle").textContent=presidential?`제${g.presTerm}년 국정 운영`:stage.title;
 document.getElementById("yearText").textContent=presidential?`임기 ${g.presTerm}년 차 · 총 5년 임기`:`정치 경력 ${g.age}세 · ${g.round+1}/${stage.rounds}단계`;
 document.getElementById("cash").textContent=`정치 자금 ${g.cash}억`;
 document.getElementById("intro").textContent=presidential?`대통령 ${g.name}님, 국민의 신뢰를 지키며 국정을 운영하세요.`:`${g.name}님, ${stage.intro}`;
 document.getElementById("quick").innerHTML=[
 ["지지율",presidential?g.approval+"%":poll()+"%"],["경쟁자",g.opponent],["정당",g.party||"무소속"],["탄핵 위험",presidential?g.impeach+"%":"해당 없음"],["정치 자금",g.cash+"억"],["경력",g.won+"단계 통과"]
 ].map(x=>`<div class="stat"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join("");
 document.getElementById("stats").innerHTML=Object.entries(statNames).map(([k,v])=>`<div class="stat"><div class="stathead"><span>${v}</span><b>${g.stats[k]}</b></div><div class="bar"><div class="fill" style="width:${g.stats[k]}%"></div></div></div>`).join("");
 document.getElementById("partyInfo").innerHTML=g.party?`<p><b>${g.party}</b> · 당내 지지도 ${g.partySupport}%</p><p class="muted">당원과 의원들의 협조를 얻으면 정책 추진과 선거에 도움이 됩니다.</p>`:`<p>현재 무소속입니다. 사회 진출 단계 이후 정당을 창당하거나 기존 정당에 합류할 수 있습니다.</p>`;
 document.getElementById("pollInfo").innerHTML=presidential?`<p>국정 지지율 <b class="metric">${g.approval}%</b></p><div class="bar"><div class="fill" style="width:${g.approval}%"></div></div><p class="muted">국정 지지율이 낮으면 탄핵 정국이나 재선 실패 위험이 커집니다.</p>`:`<p>예상 지지율 <b class="metric">${poll()}%</b> · 경쟁자 ${g.opponent} 예상 득표율 ${100-poll()}%</p><div class="bar"><div class="fill" style="width:${poll()}%"></div></div><p class="muted">여론조사는 현재 능력치·정당 기반·정치 자금 등을 반영한 게임 내 추정치입니다.</p>`;
 let ev=presidential?presidents[(g.presTerm-1)%presidents.length]:stage.events[g.round];
 document.getElementById("eventTitle").textContent=presidential?`국정 과제 ${g.presTerm}년 차`:`선택 ${g.round+1}`;
 document.getElementById("eventDesc").textContent=ev[0];
 document.getElementById("choices").innerHTML=ev.slice(1).map((c,i)=>`<button onclick="choose(${i})">${["①","②","③"][i]} ${c[0]}</button>`).join("");
 let acts=[];
 if(!g.partyFounded&&g.stage>=4&&!presidential)acts.push(`<button class="gold" onclick="foundParty()">정당 창당</button>`);
 if(!g.party&&g.stage>=4&&!presidential)acts.push(`<button onclick="joinParty()">기존 정당 합류</button>`);
 acts.push(`<button class="secondary" onclick="campaign()">민심 청취 활동 (-2억)</button>`);
 acts.push(`<button class="secondary" onclick="fundraise()">후원금 모금</button>`);
 if(presidential&&g.impeach>=45)acts.push(`<button class="danger" onclick="respondImpeachment()">탄핵 정국 대응</button>`);
 document.getElementById("actions").innerHTML=acts.join("");
 document.getElementById("news").innerHTML=g.news.map(n=>`<div class="news">${n.t}</div>`).join("");
 document.getElementById("log").innerHTML=g.log.map(x=>`<div class="logline">${x}</div>`).join("");
}
function poll(){return clamp(5+g.stats.trust*.22+g.stats.pop*.2+g.stats.lead*.12+g.stats.policy*.12+g.stats.speech*.1+g.stats.network*.08+(g.party?g.partySupport*.12:0)+Math.min(10,g.cash*.2))}
function choose(i){
 if(g.done)return;
 let pres=g.phase==="president",ev=pres?presidents[(g.presTerm-1)%presidents.length]:stages[g.stage].events[g.round],c=ev[i+1],delta=c[1];
 Object.keys(delta).forEach(k=>{
  if(k==="approval")g.approval=clamp(g.approval+delta[k]);
  else g.stats[k]=clamp(g.stats[k]+delta[k]);
 });
 if(pres){
  g.term++;
  let scandal=Math.random();
  if(scandal<.16){g.impeach=clamp(g.impeach+12);g.approval=clamp(g.approval-5);news("언론: 국정 운영을 둘러싼 논란이 불거졌습니다.","bad");}
  else if(scandal>.88){g.approval=clamp(g.approval+4);news("언론: 주요 국정 과제에서 성과가 나타났습니다.");}
  addLog(`대통령 임기 ${g.presTerm}년 차: ${c[0]}`);
  if(g.impeach>=75){finish("impeached");return}
  if(g.presTerm>=5){finish("term");return}
  g.presTerm++;g.cash+=4;
 }else{
  let stage=stages[g.stage];g.round++;
  addLog(`${stage.name}: ${c[0]}`);
  let score=poll()+Math.floor(Math.random()*13)-6;
  if(g.round>=stage.rounds){
   if(score>=stage.win){
    g.won++;news(`${stage.title}: ${g.name} 후보가 당선됐습니다.`);addLog(`${stage.name} 선거 승리!`);
    if(g.stage===4&&!g.partyFounded){news("정계에서 정당 창당 또는 합류 요구가 커지고 있습니다.");}
    g.stage++;g.round=0;g.age+=3;g.cash+=8;g.stats.trust=clamp(g.stats.trust+3);g.stats.lead=clamp(g.stats.lead+3);
    if(g.stage>=stages.length){finish("ready");return}
   }else{
    news(`${stage.title}: ${g.opponent} 후보에게 패배했습니다.`,"bad");finish("lost");return;
   }
  }
 }
 render();
}
function foundParty(){
 if(g.cash<5){alert("창당에는 정치 자금 5억이 필요합니다.");return}
 let n=prompt("새 정당의 이름을 입력하세요.","새로운내일당");if(!n||!n.trim())return;
 g.party=n.trim().slice(0,16);g.partyFounded=true;g.partySupport=clamp(30+g.stats.network*.35);g.cash-=5;g.stats.lead=clamp(g.stats.lead+5);
 news(`${g.name} 인사가 ${g.party} 창당을 선언했습니다.`);addLog(`${g.party} 창당`);render();
}
function joinParty(){
 let n=partyNames[Math.floor(Math.random()*partyNames.length)];g.party=n;g.partySupport=38;g.stats.network=clamp(g.stats.network+5);news(`${g.name} 인사가 ${n}에 입당했습니다.`);addLog(`${n} 입당`);render();
}
function campaign(){
 if(g.cash<2){alert("정치 자금이 부족합니다.");return}
 g.cash-=2;g.stats.trust=clamp(g.stats.trust+3);g.stats.network=clamp(g.stats.network+3);g.stats.pop=clamp(g.stats.pop+2);
 if(g.party)g.partySupport=clamp(g.partySupport+2);
 news("언론: 현장 중심의 민심 청취 행보가 이어졌습니다.");addLog("민심 청취 활동 진행");render();
}
function fundraise(){
 let gain=3+Math.floor(Math.random()*5);g.cash+=gain;g.stats.network=clamp(g.stats.network+1);
 news(`정치 후원금 ${gain}억이 모였습니다.`);addLog(`후원금 ${gain}억 모금`);render();
}
function finish(reason){
 g.done=true;let r=document.getElementById("result");r.hidden=false;
 document.getElementById("eventTitle").textContent="정치 인생의 결산";document.getElementById("eventDesc").textContent="당신의 선택이 만든 결과입니다.";document.getElementById("choices").innerHTML="";document.getElementById("actions").innerHTML="";
 let title="",body="";
 if(reason==="ready"){
  g.phase="president";g.presTerm=1;g.approval=clamp(48+g.stats.trust*.18+g.stats.policy*.08);g.impeach=0;g.term=0;g.done=false;
  news("개표 결과: "+g.name+" 후보가 대한민국 대통령에 당선됐습니다.");addLog("대통령 당선! 5년 임기가 시작됩니다.");
  render();document.getElementById("result").hidden=true;return;
 }
 if(reason==="term"){
  g.termsServed++;
  title="대통령 5년 임기 종료";
  if(g.termsServed>=2){r.innerHTML=`<div class="tag">대통령 임기 결산</div><h2>두 번째 임기 종료</h2><p>헌법상 두 번째 임기를 마쳤습니다. 이제 정계 은퇴 후 기록을 남깁니다.</p><p>최종 국정 지지율 ${g.approval}%</p><button class="secondary" onclick="retire()">정계 은퇴</button>`;return;}
  if(g.approval>=55){body="임기 말 국정 지지율이 안정적입니다. 재선에 도전할 수 있습니다.";}
  else body="국정 지지율이 낮아 재선 도전이 쉽지 않습니다. 그래도 도전하거나 정계 은퇴를 선택할 수 있습니다.";
  r.innerHTML=`<div class="tag">대통령 임기 결산</div><h2>${title}</h2><p class="metric">최종 국정 지지율 ${g.approval}%</p><p>${body}</p><div class="row"><button class="gold" onclick="reelect()">재선 도전</button><button class="secondary" onclick="retire()">정계 은퇴</button></div>`;return;
 }
 if(reason==="impeached"){
  r.innerHTML=`<div class="tag">헌정 위기</div><h2>탄핵으로 임기 종료</h2><p>탄핵 위험이 임계치에 도달해 대통령직을 유지하지 못했습니다.</p><p>최종 국정 지지율 ${g.approval}% · 탄핵 위험 ${g.impeach}%</p><button class="gold" onclick="resetGame()">새로운 정치 인생 시작</button>`;return;
 }
 if(reason==="reelectWin"||reason==="reelectLose"||reason==="retired"){
  let win=reason==="reelectWin";r.innerHTML=`<div class="tag">정치 인생 최종 기록</div><h2>${reason==="retired"?"정계 은퇴":win?"대통령 재선 성공":"대통령 재선 실패"}</h2><p class="metric">${g.name}${win?" 대통령 2기": "의 정치 여정"}</p><p>통과 단계 ${g.won}/6 · 최종 능력치 ${avg()}점 · 정당 ${g.party||"무소속"}</p><button class="gold" onclick="resetGame()">다시 도전하기</button>`;return;
 }
 r.innerHTML=`<div class="tag">정치 인생 결산</div><h2>선거 패배</h2><p>${g.opponent} 후보에게 패배했습니다. 통과한 단계 ${g.won}/6</p><button class="gold" onclick="resetGame()">다시 도전하기</button>`;
}
function reelect(){
 if(g.termsServed>=2){retire();return}
 let chance=clamp(g.approval*.65+g.stats.trust*.12+g.stats.policy*.08-25);
 let roll=Math.floor(Math.random()*100)+1;
 if(roll<=chance){g.approval=clamp(g.approval+4);g.done=false;g.phase="president";g.presTerm=1;g.term=0;g.impeach=0;g.log.unshift("대통령 재선 성공! 두 번째 5년 임기가 시작됩니다.");g.news.unshift({t:"개표 결과: 현직 대통령이 재선에 성공했습니다."});render();document.getElementById("result").hidden=true;}
 else finish("reelectLose");
}
function respondImpeachment(){
 g.impeach=clamp(g.impeach-22);g.approval=clamp(g.approval+3);g.stats.trust=clamp(g.stats.trust+3);
 news("대통령이 국회와 국민 앞에서 해명하고 독립적인 사실 확인 절차를 수용했습니다.");addLog("탄핵 정국에서 공개 설명과 조사 수용");render();
}
function retire(){finish("retired")}
function resetGame(){g=null;document.getElementById("setup").hidden=false;document.getElementById("game").hidden=true;document.getElementById("result").hidden=true;document.getElementById("playerName").value="";}
</script></body></html>
